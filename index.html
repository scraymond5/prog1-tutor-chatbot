<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>COSC 1336 / ITSE 1302 Tutor</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="chatbot-container">

        <h1>COSC 1336 / ITSE 1302 Tutor</h1>
	    <h1>By: Professor Raymond</h1>

        <p class="instructions">
            Ask me questions about C++ programming.</p>

        <section id="conversation" class="conversation">
                <div class="bot-message">Hello! Welcome to Professor Raymond's tutor.<br>You can ask me about topics in the COSC 1336 / ITSE 1302 Programming class.<br>You can ask about variables, input, loops, etc.</p></div>
        </section>

        <section class="input-area">
            <input
                type="text"
                id="question"
                placeholder="Enter your programming question">

            <button id="askButton">Ask</button>
        </section>

    </main>

    <script src="chatbot.js"></script>

</body>
</html>
